[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mace-gaussian-interface"
version = "0.2.0"
description = "Interface between MACE ML potentials and Gaussian for molecular calculations with MACE-OMOL-0 support"
readme = "README.md"
authors = [
    {name = "Manuel Ott", email = "your.email@domain.com"}
]
keywords = ["quantum-chemistry", "machine-learning", "molecular-simulation", "gaussian", "mace", "mace-omol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research", 
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.20.0",
    "pyzmq>=22.0.0", 
    "ase>=3.22.0",
    "torch>=1.12.0",
    "mace-torch>=0.3.14",  # Updated: MACE-OMOL-0 requires >= 0.3.14
    "rdkit>=2022.03.0",
    "espaloma_charge>=0.0.8",
    "matplotlib>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a1",
]

[project.scripts]
gm-main = "gm_main:main"
gm-diagnose = "gm_main:diagnose_main"

[project.urls]
Homepage = "https://github.com/yourusername/mace-gaussian-interface"
Repository = "https://github.com/yourusername/mace-gaussian-interface.git" 
Issues = "https://github.com/yourusername/mace-gaussian-interface/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["calculators", "gm_main", "gaussian_parser", "analyze_spectra", "comparison_workflow", "mode_matching", "fchk_parser", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests that require CUDA GPU",
    "gaussian: marks tests that require Gaussian 16 (g16/formchk)",
    "slow: marks tests that take >30 seconds",
]
addopts = [
    "--strict-markers",
    "-ra",
]

[tool.coverage.run]
source = [
    "gaussian_parser",
    "fchk_parser",
    "mode_matching",
    "analyze_spectra",
    "comparison_workflow",
    "calculators",
    "gm_main",
    "cli",
    "dft_baseline",
    "utils",
]
omit = [
    "tests/*",
    "mace_dipole_pkg/*",
    "mace_ML_pkg/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
